const { useState, useEffect, useRef, useContext, useCallback } = React;

// ── Terminal typing hook ──────────────────────────────────────────────────
function useTerminal(lines, charMs = 22, lineMs = 120) {
  const [output, setOutput] = useState([]);
  const [done, setDone]     = useState(false);
  const cancelled = useRef(false);

  useEffect(() => {
    cancelled.current = false;
    (async () => {
      await delay(300);
      for (let i = 0; i < lines.length; i++) {
        if (cancelled.current) return;
        const { text, cls } = lines[i];
        setOutput(prev => [...prev, { text: '', cls }]);
        for (let j = 0; j < text.length; j++) {
          if (cancelled.current) return;
          await delay(text[j] === ' ' ? charMs * 0.6 : charMs);
          setOutput(prev => {
            const next = [...prev];
            next[next.length - 1] = { text: text.slice(0, j + 1), cls };
            return next;
          });
        }
        await delay(lineMs);
      }
      if (!cancelled.current) setDone(true);
    })();
    return () => { cancelled.current = true; };
  }, []);

  return { output, done };
}

// ── Tweaks panel ──────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "surfaceShade": 0
}/*EDITMODE-END*/;

function TweaksPanel({ visible, tweaks, onChange }) {
  const surfaceOptions = [
    { label: 'Default Dark', val: 0, black: '#06050E', surface: '#0D0B1A', surface2: '#131127', border: '#1C1835' },
    { label: 'Deeper Black', val: 1, black: '#030208', surface: '#080614', surface2: '#0D0B1A', border: '#150F2B' },
    { label: 'Warm Dusk', val: 2, black: '#080608', surface: '#120D18', surface2: '#181222', border: '#201835' },
  ];

  const apply = (val) => {
    const s = surfaceOptions[val];
    document.documentElement.style.setProperty('--black', s.black);
    document.documentElement.style.setProperty('--surface', s.surface);
    document.documentElement.style.setProperty('--surface-2', s.surface2);
    document.documentElement.style.setProperty('--border', s.border);
    onChange({ surfaceShade: val });
  };

  return (
    <div id="tweaks-panel" className={visible ? 'open' : ''}>
      <p style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.15em', color: 'var(--accent)', marginBottom: 16 }}>Tweaks</p>
      <div>
        <p style={{ fontSize: 10, color: 'var(--text-secondary)', marginBottom: 10, textTransform: 'uppercase', letterSpacing: '0.1em' }}>Surface Shade</p>
        {surfaceOptions.map((opt, i) => (
          <button key={i} onClick={() => apply(i)} style={{
            display: 'flex', alignItems: 'center', gap: 10, width: '100%',
            background: tweaks.surfaceShade === i ? 'var(--surface-2)' : 'transparent',
            border: `1px solid ${tweaks.surfaceShade === i ? 'var(--accent)' : 'var(--border)'}`,
            padding: '7px 10px', marginBottom: 6, cursor: 'pointer', color: 'var(--text)', fontSize: 11,
            transition: 'all 0.2s',
          }}>
            <span style={{ width: 20, height: 20, background: opt.surface, border: `2px solid ${opt.border}`, flexShrink: 0 }} />
            {opt.label}
            {tweaks.surfaceShade === i && <span style={{ marginLeft: 'auto', color: 'var(--accent)', fontSize: 10 }}>✓</span>}
          </button>
        ))}
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────
function App() {
  const saved = (() => { try { return localStorage.getItem('er_page') || 'home'; } catch { return 'home'; } })();
  const [page, setPage] = useState(saved);
  const [productId, setProductId] = useState(null);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);

  const navigate = useCallback((p) => {
    setPage(p);
    setProductId(null);
    try { localStorage.setItem('er_page', p); } catch {}
    window.scrollTo({ top: 0, behavior: 'instant' });
  }, []);

  // Global product detail navigation
  useEffect(() => {
    window.erGoToProduct = (id) => {
      setProductId(id);
      setPage('product');
      window.scrollTo({ top: 0, behavior: 'instant' });
    };
  }, []);

  // Tweaks message protocol
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode')   setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const handleTweakChange = (newVals) => {
    setTweaks(prev => ({ ...prev, ...newVals }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: newVals }, '*');
  };

  const pageMap = { home: HomePage, products: ProductsPage, about: AboutPage, careers: CareersPage, contact: ContactPage };
  const PageComponent = pageMap[page] || HomePage;

  if (page === 'product' && productId) {
    return (
      <NavCtx.Provider value={navigate}>
        <Navbar activePage="products" />
        <ProductDetailPage productId={productId} onBack={() => navigate('products')} />
        <Footer />
        <TweaksPanel visible={tweaksOpen} tweaks={tweaks} onChange={handleTweakChange} />
      </NavCtx.Provider>
    );
  }

  return (
    <NavCtx.Provider value={navigate}>
      <Navbar activePage={page} />
      <main>
        <PageComponent key={page} />
      </main>
      <Footer />
      <TweaksPanel visible={tweaksOpen} tweaks={tweaks} onChange={handleTweakChange} />
    </NavCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
