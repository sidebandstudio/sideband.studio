<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, height=1080" />
    <title>gpubridge card loop</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 500; src: url("assets/fonts/HankenGrotesk-latin-var.woff2") format("woff2"); }
      :root { --ground: #0b0b0d; --ink: #f3f2ef; --accent: #4493f8; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1440px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: "Hanken Grotesk", sans-serif; }

      #light {
        position: absolute; inset: 0;
        background:
          radial-gradient(60% 55% at 50% 38%, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 70%),
          radial-gradient(40% 18% at 50% 96%, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0) 100%);
      }
      #camera { position: absolute; inset: 0; transform-origin: 50% 58%; }

      /* The repo's architecture diagram (docs/img/architecture-dark.svg at 2x, 1760x1120) at 0.75. */
      #arch {
        position: absolute; left: 60px; top: 200px; width: 1320px; height: 840px; overflow: hidden; border-radius: 16px; background: #0d1117;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 50px 90px -30px rgba(0, 0, 0, 0.9);
      }
      #arch img { position: absolute; left: 0; top: 0; display: block; width: 1320px; height: 840px; }
      /* One ring that visits the NVIDIA island (image x 18 to 801, y 138 to 881), the AMD island
         (x 958 to 1741) and the two leaders with the all_reduce between them (x 236 to 1523, y 40 to 340). */
      #ring { position: absolute; left: 6.5px; top: 96.5px; width: 601px; height: 571px; border-radius: 30px; box-shadow: inset 0 0 0 5px var(--accent); }

      #cap {
        position: absolute; left: 0; right: 0; top: 64px; text-align: center; color: var(--ink);
        font-size: 88px; line-height: 1; font-weight: 500; letter-spacing: -0.035em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="card" data-start="0" data-duration="7" data-width="1440" data-height="1080">
      <div id="light"></div>

      <div id="camera">
        <div id="arch" data-layout-allow-overflow>
          <img src="assets/img/architecture.webp" alt="" />
          <div id="ring"></div>
        </div>
      </div>

      <div id="cap">Two vendors in one job</div>
    </div>

    <script>
      // Authored constants only. Ring boxes in the diagram's shown px, 7 to 10px outside each part.
      const NV = { left: 6.5, top: 96.5, width: 601, height: 571, borderRadius: 30 };
      const AMD = { left: 711.5, top: 96.5, width: 601, height: 571, borderRadius: 30 };
      const LEAD = { left: 167, top: 20, width: 985, height: 245, borderRadius: 18 };

      // Rest state at t=0, returned to by t=7.
      gsap.set("#camera", { scale: 1 });
      gsap.set("#ring", { ...NV, opacity: 0 });

      const tl = gsap.timeline({ paused: true });
      tl.to("#camera", { scale: 1.035, duration: 3.3, ease: "sine.inOut" }, 0.3)
        .to("#ring", { opacity: 1, duration: 0.32, ease: "power3.out" }, 0.5)
        .to("#ring", { ...AMD, duration: 0.55, ease: "power3.inOut" }, 1.9)
        .to("#ring", { ...LEAD, duration: 0.6, ease: "power3.inOut" }, 3.3)
        .to("#ring", { opacity: 0, duration: 0.3, ease: "power1.in" }, 5.1)
        .to("#camera", { scale: 1, duration: 3.0, ease: "sine.inOut" }, 3.75)
        .set("#ring", { ...NV }, 5.6);

      window.__timelines["card"] = tl;
    </script>
  </body>
</html>
