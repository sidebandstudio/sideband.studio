<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>Exerly product loop</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 500; src: url("assets/fonts/HankenGrotesk-latin-var.woff2") format("woff2"); }
      :root { --ground: #0b0b0d; --surface-2: #1b1b1f; --surface-3: #25252a; --ink: #f3f2ef; --accent: #8b5cf6; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1200px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: "Hanken Grotesk", sans-serif; }

      /* One soft light from above (the site's spotlight backdrop). */
      #light { position: absolute; inset: 0; background: radial-gradient(60% 55% at 50% 38%, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 70%); }

      /* The iPhone at 2.2x, so its UI reads in a phone-sized 4:3 crop. The screen is 880x1914, so a band of it
         fits and the phone travels. Screen coordinates below are in the unscaled 400x870 box. */
      #phone { position: absolute; left: 489px; top: 0; width: 942px; height: 1976px; }
      .ph-body {
        position: absolute; inset: 0; padding: 31px; border-radius: 145px; background: var(--surface-2);
        box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.07), 0 50px 90px -30px rgba(0, 0, 0, 0.9);
      }
      .ph-scale { position: relative; width: 880px; height: 1914px; border-radius: 114px; overflow: hidden; background: #000; }
      .ph-screen { position: absolute; left: 0; top: 0; width: 400px; height: 870px; transform: scale(2.2); transform-origin: 0 0; overflow: hidden; }
      .scr { position: absolute; inset: 0; }
      .scr img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .dim { position: absolute; inset: 0; background: #000; }

      /* A touch on the phone, and a ring around one real card. */
      .touch { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; z-index: 10; }
      .touch-dot { position: absolute; inset: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.42); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.7); }
      .touch-ring { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.8); }
      .mark { position: absolute; z-index: 9; border-radius: 12px; box-shadow: 0 0 0 2px var(--accent); }

      /* The caption sits on the ground colour, the phone rises out of it. */
      #fade { position: absolute; left: 0; right: 0; top: 0; height: 320px; background: linear-gradient(180deg, var(--ground) 0px, var(--ground) 205px, rgba(11, 11, 13, 0) 320px); }
      #caps { position: absolute; left: 0; right: 0; top: 112px; height: 100px; }
      .cap {
        position: absolute; left: 0; right: 0; top: 0; text-align: center; color: var(--ink);
        font-size: 80px; line-height: 1; font-weight: 500; letter-spacing: -0.035em; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1200">
      <div id="light"></div>

      <div id="phone" data-layout-allow-overflow>
        <div class="ph-body">
          <div class="ph-scale">
            <div class="ph-screen">
              <div id="s-progress" class="scr"><img src="assets/img/ios-progress-weight.webp" alt="" /></div>
              <div id="s-program" class="scr"><img src="assets/img/ios-program-expenditure.webp" alt="" /></div>
              <div id="s-recents" class="scr"><img src="assets/img/ios-log-food.webp" alt="" /><div id="recents-dim" class="dim"></div></div>
              <div id="s-detail" class="scr"><img src="assets/img/ios-food-detail.webp" alt="" /></div>

              <div id="mark-trend" class="mark" style="left: 19px; top: 325px; width: 362px; height: 398px"></div>
              <div id="mark-measured" class="mark" style="left: 19px; top: 170px; width: 362px; height: 326px"></div>
              <div id="t-food" class="touch" style="left: 130px; top: 260px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            </div>
          </div>
        </div>
      </div>

      <div id="fade"></div>
      <div id="caps">
        <div id="cap-1" class="cap">A few taps. A clearer day.</div>
        <div id="cap-2" class="cap">Trend weight</div>
        <div id="cap-3" class="cap">Measured expenditure</div>
      </div>
    </div>

    <script>
      // Phone y that puts screen row Y at frame y f: f - 31 - Y * 2.2. Under the caption f is 260.
      const rowAt = (Y, f = 260) => f - 31 - Y * 2.2;
      const REST_Y = rowAt(0, 245); // the whole top of the phone, status bar and Log Food sheet

      // Rest state at t=0: Log Food, phone top in view. The timeline returns every channel to it by t=12.
      // The Log Food and Food Detail captures come from one account, Progress and Program from another, so
      // the two pairs never share a beat and nothing on screen links their numbers.
      gsap.set("#phone", { y: REST_Y });
      gsap.set("#fade", { opacity: 0 });
      gsap.set("#s-progress", { xPercent: 100 });
      gsap.set("#s-program", { xPercent: 100 });
      gsap.set("#s-recents", { xPercent: 0, yPercent: 0 });
      gsap.set("#recents-dim", { opacity: 0 });
      gsap.set("#s-detail", { xPercent: 100, yPercent: 0 });
      gsap.set(".touch", { opacity: 0, scale: 0.6 });
      gsap.set(".touch-ring", { scale: 1, opacity: 0 });
      gsap.set(".mark", { opacity: 0, scale: 1.04 });

      const tl = gsap.timeline({ paused: true });
      const capIn = (id, at) => tl.fromTo(id, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.72, ease: "expo.out" }, at);
      const capOut = (id, at) => tl.to(id, { y: -12, opacity: 0, duration: 0.32, ease: "power2.in" }, at);
      const markIn = (id, at) => tl.to(id, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, at);
      const markOut = (id, at) => tl.to(id, { opacity: 0, duration: 0.3, ease: "power1.in" }, at);
      const phone = (Y, at, duration, ease) => tl.to("#phone", { y: rowAt(Y), duration, ease }, at);

      // A touch on the phone screen.
      function tap(touch, at) {
        tl.to(touch, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, at)
          .to(touch, { scale: 0.84, duration: 0.1, ease: "power2.in" }, at + 0.24)
          .fromTo(`${touch} .touch-ring`, { scale: 1, opacity: 0.9 }, { scale: 2.3, opacity: 0, duration: 0.48, ease: "power2.out", immediateRender: false }, at + 0.32)
          .to(touch, { opacity: 0, scale: 1, duration: 0.25, ease: "power1.in" }, at + 0.46);
      }

      // Beat 1 (0 to 3.6s): pick a recent meal and read its portion and nutrition.
      capIn("#cap-1", 0.45);
      tap("#t-food", 0.55);
      tl.to("#s-detail", { xPercent: 0, duration: 0.55, ease: "power3.out" }, 1.15)
        .to("#s-recents", { xPercent: -30, duration: 0.55, ease: "power3.out" }, 1.15)
        .to("#recents-dim", { opacity: 0.35, duration: 0.55, ease: "power1.out" }, 1.15)
        .to("#fade", { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 1.6);
      phone(70, 1.5, 0.7, "power2.inOut");
      phone(360, 2.2, 1.25, "power2.inOut");
      capOut("#cap-1", 3.4);

      // Beat 2 (3.6 to 7.3s): Progress and its weight trend. Screens change by a plain swipe, not app navigation.
      tl.to(["#s-detail", "#s-recents"], { xPercent: -100, duration: 0.6, ease: "power3.inOut" }, 3.6)
        .to("#s-progress", { xPercent: 0, duration: 0.6, ease: "power3.inOut" }, 3.6);
      phone(150, 3.6, 0.8, "power3.inOut");
      capIn("#cap-2", 4.05);
      phone(310, 4.6, 1.2, "power2.inOut");
      markIn("#mark-trend", 5.6);
      markOut("#mark-trend", 6.9);
      capOut("#cap-2", 7.0);

      // Beat 3 (7.3 to 10.4s): the Program screen and the expenditure it measured.
      tl.to("#s-progress", { xPercent: -100, duration: 0.6, ease: "power3.inOut" }, 7.3)
        .to("#s-program", { xPercent: 0, duration: 0.6, ease: "power3.inOut" }, 7.3);
      phone(150, 7.3, 0.6, "power3.inOut");
      capIn("#cap-3", 7.7);
      markIn("#mark-measured", 8.3);
      phone(175, 8.0, 2.0, "sine.inOut");
      markOut("#mark-measured", 9.75);
      capOut("#cap-3", 10.05);

      // Back to rest: Log Food swipes in over Program while the phone returns to its t=0 framing.
      // Detail and Log Food are off screen to the left, so they jump to the right edge unseen.
      tl.set("#s-detail", { xPercent: 100 }, 10.3)
        .set("#s-recents", { xPercent: 100 }, 10.3)
        .set("#recents-dim", { opacity: 0 }, 10.3)
        .to("#s-recents", { xPercent: 0, duration: 0.6, ease: "power3.inOut" }, 10.4)
        .to("#s-program", { xPercent: -100, duration: 0.6, ease: "power3.inOut" }, 10.4)
        .to("#phone", { y: REST_Y, duration: 1.15, ease: "power3.inOut" }, 10.45)
        .to("#fade", { opacity: 0, duration: 0.6, ease: "power1.inOut" }, 10.95)
        // Off screen now, so they go back to their t=0 state.
        .set("#s-progress", { xPercent: 100 }, 11.2)
        .set("#s-program", { xPercent: 100 }, 11.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
