<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>TandemCode product loop</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 500; src: url("assets/fonts/HankenGrotesk-latin-var.woff2") format("woff2"); }
      :root { --ground: #0b0b0d; --surface-2: #1b1b1f; --surface-3: #25252a; --ink: #f3f2ef; --muted: #8f8e98; --accent: #f97316; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1200px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: "Hanken Grotesk", sans-serif; }

      /* One soft light from above (the site's spotlight backdrop). */
      #light { position: absolute; inset: 0; background: radial-gradient(60% 55% at 50% 38%, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 70%); }

      /* A browser window on the real tandemcode.space homepage. Its address stays in view the whole loop. */
      #win { position: absolute; left: 197px; top: 253px; width: 1526px; border-radius: 18px 18px 0 0; overflow: hidden; background: var(--surface-2); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.06), 0 50px 100px -40px rgba(0, 0, 0, 0.9); }
      .bar { position: relative; height: 88px; display: flex; align-items: center; padding: 0 28px; gap: 12px; }
      .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--surface-3); }
      .url { position: absolute; left: 50%; top: 15px; width: 520px; height: 58px; margin-left: -260px; border-radius: 12px; background: #131316; color: #d8d7de; font-size: 40px; line-height: 58px; text-align: center; letter-spacing: 0.005em; }
      .page { position: relative; width: 1526px; height: 880px; overflow: hidden; background: #0a0a0c; }
      /* The page in its own CSS px: the homepage at 1440x1200 with the live demo region laid exactly over it. */
      #pg { position: absolute; left: 0; top: 0; width: 1440px; height: 1200px; transform-origin: 0 0; }
      #pg img { position: absolute; left: 0; top: 0; width: 1440px; height: 1200px; display: block; }
      #demo { position: absolute; left: 256px; top: 624px; width: 928px; height: 480px; display: block; }

      #caps { position: absolute; left: 0; right: 0; top: 112px; height: 100px; }
      .cap {
        position: absolute; left: 0; right: 0; top: 0; text-align: center; color: var(--ink);
        font-size: 80px; line-height: 1; font-weight: 500; letter-spacing: -0.035em; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1200">
      <div id="light"></div>

      <div id="win" data-layout-allow-overflow>
        <div class="bar"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="url" data-layout-ignore>tandemcode.space</div></div>
        <div class="page">
          <div id="pg">
            <img src="assets/img/tc-site-home-1440x1200.webp" alt="" />
            <video id="demo" class="clip" src="assets/video/tc-site-demo-hero.mp4" muted playsinline data-start="0" data-duration="12" data-track-index="1"></video>
          </div>
        </div>
      </div>

      <div id="caps">
        <div id="cap-1" class="cap">Shared editor</div>
        <div id="cap-2" class="cap">Hidden tests</div>
      </div>
    </div>

    <script>
      // Authored constants only. view(z, cx, top) shows the page at z frame px per CSS px, with page x cx
      // at the window's centre and page y top at the window's top edge.
      const W = 1526;
      const view = (z, cx, top) => ({ scale: z, x: W / 2 - cx * z, y: -top * z });
      const REST = view(W / 1440, 720, 0); // the homepage as it loads: headline, then the demo's header
      const CODE = view(3.2, 495, 754); // the editor's six lines and both cursors
      const CODE_END = view(3.2, 505, 760);
      const FOOT = view(1.66, 720, 630); // the whole demo panel with its footer

      // The demo region plays the page's own scripted demo from 12.1 s of its 13.5 s cycle (ACCEPTED), through
      // the wrap to the empty editor at 1.4 s, the typing (1.4 to 8.6 s), Judging (8.6 to 9.95 s) and ACCEPTED
      // to 12 s. Both ends show the same picture 12 s of demo apart (six caret pulses), so the loop is seamless.
      // Rest state at t=0: the homepage top. The timeline returns to it by 11.8 s.
      gsap.set("#pg", REST);

      const tl = gsap.timeline({ paused: true });
      const capIn = (id, at) => tl.fromTo(id, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.72, ease: "expo.out", immediateRender: false }, at);
      const capOut = (id, at) => tl.to(id, { y: -12, opacity: 0, duration: 0.32, ease: "power2.in" }, at);
      const cam = (v, at, duration, ease) => tl.to("#pg", { ...v, duration, ease }, at);

      // Beat 1 (0 to 1.7s): the site's own headline above its demo.
      // Beat 2 (1.7 to 8.1s): into the demo's editor while maya and theo type.
      cam(CODE, 1.7, 1.25, "power3.inOut");
      capIn("#cap-1", 2.55);
      cam(CODE_END, 2.95, 5.1, "sine.inOut");
      capOut("#cap-1", 7.85);

      // Beat 3 (8.1 to 11.8s): the demo's judge and its result, then back up to the headline.
      cam(FOOT, 8.15, 0.9, "power3.inOut");
      capIn("#cap-2", 8.45);
      capOut("#cap-2", 10.7);
      cam(REST, 10.8, 1.0, "power3.inOut");

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
