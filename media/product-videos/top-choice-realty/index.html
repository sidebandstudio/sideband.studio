<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>Top Choice Realty product loop</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 500; src: url("assets/fonts/HankenGrotesk-latin-var.woff2") format("woff2"); }
      :root { --ground: #0b0b0d; --surface-2: #1b1b1f; --surface-3: #25252a; --ink: #f3f2ef; --accent: #d4af37; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1200px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: "Hanken Grotesk", sans-serif; }

      #light {
        position: absolute; inset: 0;
        background:
          radial-gradient(60% 55% at 50% 38%, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 70%),
          radial-gradient(40% 18% at 50% 96%, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0) 100%);
      }
      #camera { position: absolute; inset: 0; transform-origin: 50% 50%; }

      /* Browser window. The screen is the 1440x900 CSS px captures' own aspect. */
      #win {
        position: absolute; left: 280px; top: 250px; width: 1360px; padding: 0 16px 16px; z-index: 1;
        border-radius: 20px; background: var(--surface-2);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 40px 80px -40px rgba(0, 0, 0, 0.8);
      }
      .win-bar { display: flex; align-items: center; gap: 9px; height: 44px; padding-left: 6px; }
      .win-bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--surface-3); }
      .win-screen { position: relative; width: 1328px; height: 830px; border-radius: 8px; overflow: hidden; background: #000; }
      .win-screen img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

      /* Phone. The screen is a 390x844 CSS px viewport at 1.019 px per CSS px. */
      #phone {
        position: absolute; left: 1250px; top: 330px; width: 429.4px; height: 892px; padding: 16px; border-radius: 58px; z-index: 2;
        background: var(--surface-2); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.07), 0 50px 90px -30px rgba(0, 0, 0, 0.9);
      }
      .ph-screen { position: relative; width: 397.4px; height: 860px; border-radius: 42px; overflow: hidden; background: #000; }
      .ph-screen img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

      .touch { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; }
      .touch-dot { position: absolute; inset: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.42); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.7); }
      .touch-ring { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 2.5px var(--accent); }

      #caps { position: absolute; left: 0; right: 0; top: 112px; height: 100px; }
      .cap {
        position: absolute; left: 0; right: 0; top: 0; text-align: center; color: var(--ink);
        font-size: 80px; line-height: 1; font-weight: 500; letter-spacing: -0.035em; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1200">
      <div id="light"></div>

      <div id="camera">
        <div id="win" data-layout-allow-overflow>
          <div class="win-bar"><i></i><i></i><i></i></div>
          <div class="win-screen">
            <img id="d-home" src="assets/img/site-home-desktop.webp" alt="" />
            <img id="d-login" src="assets/img/site-login-desktop.webp" alt="" />
            <!-- Clicks on the nav's Agent Login button and HOME link, in screen pixels. -->
            <div id="t-login" class="touch" style="left: 1176px; top: 36px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            <div id="t-home" class="touch" style="left: 369px; top: 36px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
          </div>
        </div>

        <div id="phone" data-layout-allow-overflow>
          <div class="ph-screen">
            <img id="m-home" src="assets/img/site-home-mobile.webp" alt="" />
          </div>
        </div>
      </div>

      <div id="caps">
        <div id="cap-1" class="cap">Serving New York and New Jersey</div>
        <div id="cap-2" class="cap">Agent back office</div>
      </div>
    </div>

    <script>
      // Authored constants only, no layout reads at tween time.
      const WIN_SIDE_X = -120; // the window steps left to make room for the phone
      const PHONE_HIDDEN_Y = 900; // the phone waits below frame, and leaves to the same spot

      // Rest state at t=0: the desktop home page alone. Every channel is back here by t=12.
      gsap.set("#camera", { x: 0, y: 0, scale: 1 });
      gsap.set("#win", { x: 0, y: 0 });
      gsap.set("#phone", { y: PHONE_HIDDEN_Y, opacity: 0 });
      gsap.set("#d-login", { opacity: 0 });
      gsap.set(".touch", { opacity: 0, scale: 0.6 });
      gsap.set(".touch-ring", { scale: 1, opacity: 0 });

      const tl = gsap.timeline({ paused: true });
      const capIn = (id, at) => tl.fromTo(id, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.72, ease: "expo.out" }, at);
      const capOut = (id, at) => tl.to(id, { y: -12, opacity: 0, duration: 0.32, ease: "power2.in" }, at);
      const cam = (v, at, duration, ease) => tl.to("#camera", { ...v, duration, ease }, at);

      // A click or tap: the dot lands and presses, an accent ring opens, then the page changes.
      function tap(touch, at, show, hide) {
        tl.to(touch, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, at)
          .to(touch, { scale: 0.84, duration: 0.1, ease: "power2.in" }, at + 0.24)
          .fromTo(`${touch} .touch-ring`, { scale: 1, opacity: 0.9 }, { scale: 2.3, opacity: 0, duration: 0.48, ease: "power2.out", immediateRender: false }, at + 0.32)
          .to(touch, { opacity: 0, scale: 1, duration: 0.25, ease: "power1.in" }, at + 0.46);
        if (show) tl.to(show, { opacity: 1, duration: 0.3, ease: "power1.inOut" }, at + 0.4);
        if (hide) tl.to(hide, { opacity: 0, duration: 0.3, ease: "power1.inOut" }, at + 0.4);
      }

      // Beat 1 (0 to 3.9s): the brokerage's home page, and the same site on a phone.
      tl.to("#win", { x: WIN_SIDE_X, duration: 1.1, ease: "power2.inOut" }, 0.35)
        .to("#phone", { y: 0, opacity: 1, duration: 1.05, ease: "expo.out" }, 0.55);
      capIn("#cap-1", 0.7);
      cam({ scale: 1.03 }, 2.0, 1.9, "sine.inOut");

      // Beat 2 (3.9 to 7.3s): close on the phone's home page, the caption stays.
      cam({ scale: 1.32, x: -376, y: -28 }, 3.85, 1.1, "power3.inOut");
      tl.to("#win", { y: 120, duration: 1.1, ease: "power3.inOut" }, 3.85); // the window settles back so the caption band stays clear
      cam({ scale: 1.34, x: -384, y: -30 }, 4.95, 2.1, "sine.inOut");
      capOut("#cap-1", 6.95);

      // Beat 3 (7.3 to 12s): the phone leaves, the desktop's Agent Login opens the sign-in for agents, then HOME.
      tl.to("#phone", { y: PHONE_HIDDEN_Y, opacity: 0, duration: 0.7, ease: "power3.in" }, 7.05);
      cam({ scale: 1.25, x: -154, y: 38 }, 7.45, 1.1, "power3.inOut");
      tl.to("#win", { y: 0, duration: 1.1, ease: "power3.inOut" }, 7.45);
      capIn("#cap-2", 7.85);
      tap("#t-login", 8.65, "#d-login");
      cam({ scale: 1.22, x: -146, y: 34 }, 9.0, 1.2, "sine.inOut");
      capOut("#cap-2", 10.1);
      tap("#t-home", 10.2, null, "#d-login");
      cam({ scale: 1, x: 0, y: 0 }, 10.6, 1.0, "power3.inOut");
      tl.to("#win", { x: 0, duration: 1.0, ease: "power3.inOut" }, 10.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
