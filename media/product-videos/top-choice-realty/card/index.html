<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, height=1080" />
    <title>Top Choice Realty card loop</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 500; src: url("assets/fonts/HankenGrotesk-latin-var.woff2") format("woff2"); }
      :root { --ground: #0b0b0d; --surface-2: #1b1b1f; --surface-3: #25252a; --ink: #f3f2ef; --accent: #d4af37; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1440px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: "Hanken Grotesk", sans-serif; }

      #light {
        position: absolute; inset: 0;
        background:
          radial-gradient(60% 55% at 50% 38%, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 70%),
          radial-gradient(40% 18% at 50% 96%, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0) 100%);
      }
      #camera { position: absolute; inset: 0; transform-origin: 50% 50%; }

      /* The hero's browser window, centred. */
      #win {
        position: absolute; left: 40px; top: 196px; width: 1360px; padding: 0 16px 16px;
        border-radius: 20px; background: var(--surface-2);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 40px 80px -40px rgba(0, 0, 0, 0.8);
      }
      .win-bar { display: flex; align-items: center; gap: 9px; height: 44px; padding-left: 6px; }
      .win-bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--surface-3); }
      .win-screen { position: relative; width: 1328px; height: 830px; border-radius: 8px; overflow: hidden; background: #000; }
      .win-screen img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

      .touch { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; }
      .touch-dot { position: absolute; inset: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.42); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.7); }
      .touch-ring { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 2.5px var(--accent); }

      #cap {
        position: absolute; left: 0; right: 0; top: 64px; text-align: center; color: var(--ink);
        font-size: 84px; line-height: 1; font-weight: 500; letter-spacing: -0.035em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1440" data-height="1080">
      <div id="light"></div>

      <div id="camera">
        <div id="win" data-layout-allow-overflow>
          <div class="win-bar"><i></i><i></i><i></i></div>
          <div class="win-screen">
            <img id="d-home" src="assets/img/site-home-desktop.webp" alt="" />
            <img id="d-login" src="assets/img/site-login-desktop.webp" alt="" />
            <div id="t-login" class="touch" style="left: 1176px; top: 36px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            <div id="t-home" class="touch" style="left: 369px; top: 36px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
          </div>
        </div>
      </div>

      <div id="cap">Agent back office</div>
    </div>

    <script>
      // Camera poses: the whole window, toward the nav's Agent Login, then on the sign-in card. Every pose keeps the window top under the caption.
      const A = { scale: 1, x: 0, y: 0 };
      const B = { scale: 1.2, x: -116, y: 63 };
      const C = { scale: 1.2, x: -292, y: 63 };

      // Rest state at t=0: the home page. Back here by t=7.
      gsap.set("#camera", A);
      gsap.set("#d-login", { opacity: 0 });
      gsap.set(".touch", { opacity: 0, scale: 0.6 });
      gsap.set(".touch-ring", { scale: 1, opacity: 0 });

      const tl = gsap.timeline({ paused: true });
      function tap(touch, at, show, hide) {
        tl.to(touch, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, at)
          .to(touch, { scale: 0.84, duration: 0.1, ease: "power2.in" }, at + 0.24)
          .fromTo(`${touch} .touch-ring`, { scale: 1, opacity: 0.9 }, { scale: 2.3, opacity: 0, duration: 0.48, ease: "power2.out", immediateRender: false }, at + 0.32)
          .to(touch, { opacity: 0, scale: 1, duration: 0.25, ease: "power1.in" }, at + 0.46);
        if (show) tl.to(show, { opacity: 1, duration: 0.3, ease: "power1.inOut" }, at + 0.4);
        if (hide) tl.to(hide, { opacity: 0, duration: 0.3, ease: "power1.inOut" }, at + 0.4);
      }

      tl.to("#camera", { ...B, duration: 1.0, ease: "power3.inOut" }, 0.35);
      tap("#t-login", 1.45, "#d-login");
      tl.to("#camera", { ...C, duration: 1.1, ease: "power3.inOut" }, 2.0)
        .to("#camera", { scale: 1.22, x: -300, y: 62, duration: 1.6, ease: "sine.inOut" }, 3.1)
        .to("#camera", { ...A, duration: 1.1, ease: "power3.inOut" }, 4.7);
      tap("#t-home", 5.9, null, "#d-login");

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
