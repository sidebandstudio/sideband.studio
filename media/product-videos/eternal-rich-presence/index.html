<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>EternalRichPresence product loop</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 500; src: url("assets/fonts/HankenGrotesk-latin-var.woff2") format("woff2"); }
      :root { --ground: #0b0b0d; --surface-2: #1b1b1f; --surface-3: #25252a; --ink: #f3f2ef; --accent: #ff6b7d; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1200px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: "Hanken Grotesk", sans-serif; }

      #light {
        position: absolute; inset: 0;
        background:
          radial-gradient(60% 55% at 50% 40%, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 70%),
          radial-gradient(40% 18% at 50% 96%, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0) 100%);
      }
      #camera { position: absolute; inset: 0; transform-origin: 50% 50%; }

      /* PC monitor. The screen shows the real Windows capture of EternalRichPresence in host mode: the banner and
         startup lines only, with the folder path on the starting line covered in the terminal's own background. */
      #pc { position: absolute; left: 489px; top: 352px; width: 942px; }
      .pc-body {
        position: relative; z-index: 1; width: 942px; height: 524px; padding: 16px;
        border-radius: 20px; background: var(--surface-2);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 40px 80px -40px rgba(0, 0, 0, 0.8);
      }
      .pc-screen { position: relative; width: 910px; height: 492px; border-radius: 8px; overflow: hidden; background: #0c0c0c; }
      /* Rows 140 to 404, columns 2 to 757 of the capture at 1.2x, kept at their original place on screen. */
      .pc-screen img { position: absolute; left: 2.4px; top: 168px; display: block; width: 907.2px; height: 318px; }
      .pc-neck { width: 124px; height: 92px; margin: -6px auto 0; background: linear-gradient(180deg, #141417 0%, #1d1d21 100%); }
      .pc-base { width: 310px; height: 14px; margin: 0 auto; border-radius: 7px; background: var(--surface-3); }

      /* The real Discord profile with the presence (758x488 crop at 1.05x). */
      #dc {
        position: absolute; left: 930px; top: 480px; width: 796px; height: 512px; z-index: 3; border-radius: 18px; overflow: hidden;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 50px 90px -30px rgba(0, 0, 0, 0.9);
      }
      #dc img { display: block; width: 100%; height: 100%; }

      .ring { position: absolute; border-radius: 10px; box-shadow: inset 0 0 0 3px var(--accent); }
      .click { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--accent); }
      /* The link from the PC to Discord, drawn from its left end. */
      #link { position: absolute; z-index: 2; height: 3px; border-radius: 2px; background: var(--accent); transform-origin: 0 50%; }
      #link-dot { position: absolute; left: 0; top: -5.5px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 18px 4px rgba(255, 107, 125, 0.55); }

      #caps { position: absolute; left: 0; right: 0; top: 112px; height: 100px; }
      .cap {
        position: absolute; left: 0; right: 0; top: 0; text-align: center; color: var(--ink);
        font-size: 80px; line-height: 1; font-weight: 500; letter-spacing: -0.035em; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1200">
      <div id="light"></div>

      <div id="camera">
        <div id="pc">
          <div class="pc-body">
            <div class="pc-screen">
              <img src="assets/img/terminal-host-status.webp" alt="" />
              <div id="ring-rpc" class="ring" style="left: 0; top: 459px; width: 220px; height: 30px; border-radius: 6px"></div>
            </div>
          </div>
          <div class="pc-neck"></div>
          <div class="pc-base"></div>
        </div>

        <div id="link" data-layout-allow-overflow><div id="link-dot"></div></div>

        <div id="dc" data-layout-allow-overflow>
          <img src="assets/img/discord-profile-crop.webp" alt="" />
          <div id="ring-presence" class="ring" style="left: 32px; top: 296px; width: 732px; height: 208px; border-radius: 14px"></div>
          <div id="ring-cover" class="ring" style="left: 40px; top: 337px; width: 116px; height: 105px"></div>
          <div id="click-join" class="click" style="left: 397px; top: 468px"></div>
        </div>
      </div>

      <div id="caps">
        <div id="cap-1" class="cap">Listening status on Discord</div>
        <div id="cap-2" class="cap">Live cover art</div>
        <div id="cap-3" class="cap">Listen Along</div>
      </div>
    </div>

    <script>
      // Authored constants only, no layout reads at tween time.
      const PC_SHIFT = -290; // the PC moves left to make room for Discord
      const DC_HIDDEN_Y = 700; // the Discord card waits below frame, and leaves to the same spot
      // The link runs from the end of "Connected to Discord RPC" (PC shifted) to the left edge of the presence box.
      const A = { x: 489 + PC_SHIFT + 16 + 216, y: 352 + 16 + 474 };
      const B = { x: 930 + 32, y: 480 + 392 };
      const LINK_LEN = Math.hypot(B.x - A.x, B.y - A.y);
      const LINK_ANGLE = (Math.atan2(B.y - A.y, B.x - A.x) * 180) / Math.PI;

      // Rest state at t=0. The timeline returns every channel to it by t=12, so the loop has no seam.
      gsap.set("#camera", { x: 0, y: 0, scale: 1 });
      gsap.set("#pc", { x: 0 });
      gsap.set("#dc", { y: DC_HIDDEN_Y, opacity: 0 });
      gsap.set("#link", { left: A.x, top: A.y - 1.5, width: LINK_LEN, rotation: LINK_ANGLE, scaleX: 0 });
      gsap.set("#link-dot", { x: 0, opacity: 0 });
      gsap.set(".ring", { opacity: 0, scale: 1 });
      gsap.set("#click-join", { opacity: 0, scale: 0.5 });

      const tl = gsap.timeline({ paused: true });
      const capIn = (id, at) => tl.fromTo(id, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.72, ease: "expo.out" }, at);
      const capOut = (id, at) => tl.to(id, { y: -12, opacity: 0, duration: 0.32, ease: "power2.in" }, at);
      const cam = (v, at, duration, ease) => tl.to("#camera", { ...v, duration, ease }, at);
      const ringIn = (id, at) => tl.fromTo(id, { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out", immediateRender: false }, at);
      const ringOut = (id, at) => tl.to(id, { opacity: 0, duration: 0.25, ease: "power1.in" }, at);

      // Beat 1 (0 to 4.2s): the tray app on the PC connects to Discord, and the profile shows the song.
      tl.to("#pc", { x: PC_SHIFT, duration: 1.15, ease: "power2.inOut" }, 0.25);
      capIn("#cap-1", 0.7);
      ringIn("#ring-rpc", 1.2);
      tl.to("#dc", { y: 0, opacity: 1, duration: 1.05, ease: "expo.out" }, 1.35)
        .to("#link", { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 1.75)
        .to("#link-dot", { opacity: 1, duration: 0.12, ease: "none" }, 2.2)
        .to("#link-dot", { x: LINK_LEN, duration: 0.55, ease: "power1.inOut" }, 2.2)
        .to("#link-dot", { opacity: 0, duration: 0.15, ease: "none" }, 2.65);
      ringIn("#ring-presence", 2.7);
      cam({ scale: 1.015 }, 2.3, 1.8, "sine.inOut");
      capOut("#cap-1", 4.05);
      ringOut("#ring-rpc", 4.0);
      ringOut("#ring-presence", 4.0);

      // Beat 2 (4.2 to 7.25s): the real album cover sits on the status.
      cam({ scale: 1.18, x: -242, y: -77 }, 4.15, 1.1, "power3.inOut");
      capIn("#cap-2", 4.55);
      ringIn("#ring-cover", 5.3);
      tl.fromTo("#ring-cover", { scale: 1 }, { scale: 1.05, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 6.2);
      cam({ scale: 1.16, x: -230, y: -72 }, 5.3, 1.9, "sine.inOut");
      capOut("#cap-2", 7.2);
      ringOut("#ring-cover", 7.15);

      // Beat 3 (7.25 to 12s): a friend presses Ask to Join to listen along, then all returns to rest.
      cam({ scale: 1.15, x: -417, y: -85 }, 7.25, 1.2, "power3.inOut");
      capIn("#cap-3", 7.65);
      tl.fromTo("#click-join", { opacity: 1, scale: 0.5 }, { opacity: 0, scale: 1.6, duration: 0.55, ease: "power2.out", immediateRender: false }, 8.7)
        .fromTo("#click-join", { opacity: 1, scale: 0.5 }, { opacity: 0, scale: 1.6, duration: 0.55, ease: "power2.out", immediateRender: false }, 9.3);
      cam({ scale: 1.13, x: -405, y: -80 }, 8.45, 1.1, "sine.inOut");
      capOut("#cap-3", 9.6);
      cam({ scale: 1, x: 0, y: 0 }, 9.6, 0.95, "power3.inOut");
      tl.to("#link", { scaleX: 0, duration: 0.45, ease: "power2.in" }, 10.2)
        .to("#dc", { y: DC_HIDDEN_Y, opacity: 0, duration: 0.7, ease: "power2.in" }, 10.55)
        .to("#pc", { x: 0, duration: 1.0, ease: "power2.inOut" }, 10.85)
        .set("#link-dot", { x: 0 }, 11.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
