<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>hushtype product loop</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 500; src: url("assets/fonts/HankenGrotesk-latin-var.woff2") format("woff2"); }
      :root { --ground: #0b0b0d; --surface-2: #1b1b1f; --surface-3: #25252a; --ink: #f3f2ef; --muted: #9a9894; --accent: #b2c8a6; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1200px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: "Hanken Grotesk", sans-serif; }

      #light {
        position: absolute; inset: 0;
        background:
          radial-gradient(60% 55% at 50% 38%, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 70%),
          radial-gradient(40% 18% at 50% 96%, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0) 100%);
      }
      #camera { position: absolute; inset: 0; transform-origin: 50% 50%; }

      /* hushtype's own settings windows, as screenshotted by the app's author (repo website/images), at 1.2x.
         Each image carries its window shadow on a transparent margin; the window itself starts at image x 56, y 38. */
      .appwin { position: absolute; left: 304.8px; top: 190.4px; width: 1310.4px; }
      .appwin img { display: block; width: 100%; height: 100%; }
      #dark { height: 1046.4px; }
      #lightwin { height: 1166.4px; }
      /* Highlight on the Transcribe Shortcut key, "Option + Space" (image x 716 to 822, y 486 to 510). */
      #ring { position: absolute; left: 852px; top: 576px; width: 139px; height: 42px; border-radius: 10px; box-shadow: 0 0 0 3px var(--accent); }

      /* The product website, only ever inside a browser window with its address showing. */
      #site {
        position: absolute; left: 280px; top: 250px; width: 1360px; padding: 0 16px 16px;
        border-radius: 20px; background: var(--surface-2);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 40px 80px -40px rgba(0, 0, 0, 0.8);
      }
      .win-bar { display: flex; align-items: center; gap: 9px; height: 52px; padding-left: 6px; }
      .win-bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--surface-3); }
      .url {
        margin-left: 22px; height: 32px; padding: 0 16px; border-radius: 16px; background: var(--surface-3);
        color: var(--muted); font-size: 19px; line-height: 32px; letter-spacing: 0.005em;
      }
      .win-screen { position: relative; width: 1328px; height: 830px; border-radius: 8px; overflow: hidden; background: #f3f0e8; }
      .win-screen img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

      /* A band of the ground behind the captions while the camera is close on a window. */
      #veil { position: absolute; left: 0; right: 0; top: 0; height: 236px; background: linear-gradient(180deg, var(--ground) 0px, var(--ground) 214px, rgba(11, 11, 13, 0) 236px); }

      #caps { position: absolute; left: 0; right: 0; top: 112px; height: 100px; }
      .cap {
        position: absolute; left: 0; right: 0; top: 0; text-align: center; color: var(--ink);
        font-size: 80px; line-height: 1; font-weight: 500; letter-spacing: -0.035em; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1200">
      <div id="light"></div>

      <div id="camera">
        <div id="lightwin" class="appwin" data-layout-allow-overflow><img src="assets/img/app-modes-light.webp" alt="" /></div>
        <div id="dark" class="appwin" data-layout-allow-overflow>
          <img src="assets/img/app-dictation-dark.webp" alt="" />
          <div id="ring"></div>
        </div>
        <div id="site" data-layout-allow-overflow>
          <div class="win-bar"><i></i><i></i><i></i><span class="url">hushtype.vercel.app</span></div>
          <div class="win-screen"><img src="assets/img/site-home-desktop.webp" alt="" /></div>
        </div>
      </div>

      <div id="veil"></div>
      <div id="caps">
        <div id="cap-1" class="cap">Hold to talk</div>
        <div id="cap-2" class="cap">Modes per app</div>
        <div id="cap-3" class="cap">Recognition on your Mac</div>
      </div>
    </div>

    <script>
      // Authored constants only, no layout reads at tween time.
      // A camera pose that puts layout point (cx, cy) at the frame centre at scale s.
      const pose = (cx, cy, s) => ({ scale: s, x: -s * (cx - 960), y: -s * (cy - 600) });
      const A = pose(960, 600, 1); // the Dictation window whole
      const P1 = pose(951.6, 777, 1.4); // its "Hold. Speak. Release." card and the shortcut rows
      const P2 = pose(951.6, 875.5, 1.3); // the four modes
      const P2B = pose(951.6, 900, 1.32);
      const P3 = pose(630, 473.5, 1.7); // the site's address, headline and first paragraph
      const P3B = pose(640, 478, 1.73);
      const OUT = { opacity: 0, y: 40, scale: 0.96 }; // a window waiting off stage

      // Rest state at t=0: the Dictation window alone. Every channel is back here by t=12.
      gsap.set("#camera", A);
      gsap.set("#dark", { opacity: 1, y: 0, scale: 1 });
      gsap.set(["#lightwin", "#site"], OUT);
      gsap.set("#ring", { opacity: 0, scale: 0.92 });
      gsap.set("#veil", { opacity: 0 });

      const tl = gsap.timeline({ paused: true });
      const capIn = (id, at) => tl.fromTo(id, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.72, ease: "expo.out" }, at);
      const capOut = (id, at) => tl.to(id, { y: -12, opacity: 0, duration: 0.32, ease: "power2.in" }, at);
      const cam = (v, at, duration, ease) => tl.to("#camera", { ...v, duration, ease }, at);
      // One window steps back as the next rises into its place.
      const swap = (from, to, at) =>
        tl.to(from, { ...OUT, duration: 0.5, ease: "power2.in" }, at)
          .to(to, { opacity: 1, y: 0, scale: 1, duration: 0.85, ease: "expo.out" }, at + 0.3);

      // Beat 1 (0 to 3.9s): the Dictation settings, close on Hold. Speak. Release. and the Option + Space shortcut.
      capIn("#cap-1", 0.5);
      cam(P1, 0.6, 1.3, "power3.inOut");
      tl.to("#veil", { opacity: 1, duration: 0.6, ease: "power1.inOut" }, 0.9)
        .to("#ring", { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 2.0)
        .to("#ring", { opacity: 0, duration: 0.3, ease: "power1.in" }, 3.4);
      cam(pose(955, 781, 1.42), 1.9, 1.8, "sine.inOut");
      capOut("#cap-1", 3.6);

      // Beat 2 (3.9 to 7.5s): the Modes settings, Messaging, Email, Code and Default.
      swap("#dark", "#lightwin", 3.75);
      cam(P2, 3.75, 1.1, "power3.inOut");
      capIn("#cap-2", 4.2);
      cam(P2B, 4.85, 2.4, "sine.inOut");
      capOut("#cap-2", 7.2);

      // Beat 3 (7.5 to 12s): the product website in a browser, where speech recognition runs on your Mac.
      swap("#lightwin", "#site", 7.4);
      cam(P3, 7.4, 1.1, "power3.inOut");
      tl.to("#veil", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 7.5);
      capIn("#cap-3", 7.9);
      cam(P3B, 8.5, 1.9, "sine.inOut");
      capOut("#cap-3", 10.35);
      swap("#site", "#dark", 10.5);
      cam(A, 10.5, 1.2, "power3.inOut");

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
