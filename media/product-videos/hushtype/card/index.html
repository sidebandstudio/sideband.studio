<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, height=1080" />
    <title>hushtype card loop</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 500; src: url("assets/fonts/HankenGrotesk-latin-var.woff2") format("woff2"); }
      :root { --ground: #0b0b0d; --ink: #f3f2ef; --accent: #b2c8a6; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1440px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: "Hanken Grotesk", sans-serif; }

      #light {
        position: absolute; inset: 0;
        background:
          radial-gradient(60% 55% at 50% 38%, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 70%),
          radial-gradient(40% 18% at 50% 96%, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0) 100%);
      }
      #camera { position: absolute; inset: 0; transform-origin: 50% 50%; }

      /* hushtype's own Dictation settings (repo website/images/app-dark.png) at 1.12x. The window starts at image x 56, y 38. */
      #dark { position: absolute; left: 108.5px; top: 162.4px; width: 1223px; height: 976.6px; }
      #dark img { display: block; width: 100%; height: 100%; }
      /* Highlight on the Transcribe Shortcut key, "Option + Space" (image x 716 to 822, y 486 to 510). */
      #ring { position: absolute; left: 795px; top: 538px; width: 130px; height: 39px; border-radius: 10px; box-shadow: 0 0 0 3px var(--accent); }

      /* A band of the ground behind the caption while the camera is close on the window. */
      #veil { position: absolute; left: 0; right: 0; top: 0; height: 200px; background: linear-gradient(180deg, var(--ground) 0px, var(--ground) 178px, rgba(11, 11, 13, 0) 200px); }

      #cap {
        position: absolute; left: 0; right: 0; top: 64px; text-align: center; color: var(--ink);
        font-size: 84px; line-height: 1; font-weight: 500; letter-spacing: -0.035em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1440" data-height="1080">
      <div id="light"></div>

      <div id="camera">
        <div id="dark" data-layout-allow-overflow>
          <img src="assets/img/app-dictation-dark.webp" alt="" />
          <div id="ring"></div>
        </div>
      </div>

      <div id="veil"></div>
      <div id="cap">Hold to talk</div>
    </div>

    <script>
      // A camera pose that puts layout point (cx, cy) at the frame centre at scale s.
      const pose = (cx, cy, s) => ({ scale: s, x: -s * (cx - 720), y: -s * (cy - 540) });
      const A = pose(720, 540, 1); // the whole window
      const B = pose(712, 700, 1.5); // "Hold. Speak. Release." and the shortcut rows

      // Rest state at t=0, returned to by t=7.
      gsap.set("#camera", A);
      gsap.set("#ring", { opacity: 0, scale: 0.92 });
      gsap.set("#veil", { opacity: 0 });

      const tl = gsap.timeline({ paused: true });
      tl.to("#camera", { ...B, duration: 1.3, ease: "power3.inOut" }, 0.6)
        .to("#veil", { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 0.8)
        .to("#camera", { ...pose(716, 706, 1.53), duration: 2.6, ease: "sine.inOut" }, 1.9)
        .to("#ring", { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 2.2)
        .to("#ring", { opacity: 0, duration: 0.3, ease: "power1.in" }, 4.5)
        .to("#camera", { ...A, duration: 1.3, ease: "power3.inOut" }, 4.95)
        .to("#veil", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 5.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
