<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>Signature Cuts 413 product loop</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 500; src: url("assets/fonts/HankenGrotesk-latin-var.woff2") format("woff2"); }
      :root { --ground: #0b0b0d; --surface-2: #1b1b1f; --ink: #f3f2ef; --accent: #d4c5b0; --site: #050505; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1200px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: "Hanken Grotesk", sans-serif; }

      #light {
        position: absolute; inset: 0;
        background:
          radial-gradient(60% 55% at 50% 38%, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 70%),
          radial-gradient(40% 18% at 50% 96%, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0) 100%);
      }
      #camera { position: absolute; inset: 0; transform-origin: 50% 50%; }

      /* The shop's storefront photo (from the site's repo), shown as a photo. */
      #photo {
        position: absolute; left: 380px; top: 330px; width: 560px; height: 560px; border-radius: 24px; overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06), 0 40px 80px -40px rgba(0, 0, 0, 0.8);
      }
      #photo img { display: block; width: 100%; height: 100%; }

      /* Phone. The screen is a 390x844 CSS px viewport at 1.019 px per CSS px. */
      #phone {
        position: absolute; left: 1100px; top: 262px; width: 429.4px; height: 892px; padding: 16px; border-radius: 58px;
        background: var(--surface-2); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.07), 0 50px 90px -30px rgba(0, 0, 0, 0.9);
      }
      .screen { position: relative; width: 397.4px; height: 860px; border-radius: 42px; overflow: hidden; background: var(--site); }
      .page { position: absolute; left: 0; top: 0; width: 397.4px; height: 860px; }
      .page img { position: absolute; left: 0; top: 0; display: block; width: 397.4px; }
      /* The booking section as one strip per form state, scrolled by moving the strip. */
      #strip { position: absolute; left: 0; top: 0; width: 397.4px; height: 1589.7px; }
      #strip img { height: 1589.7px; }
      #strip #e0 { height: 1444.9px; }
      #bar { position: absolute; left: 0; bottom: 0; width: 397.4px; height: 63.2px; }
      #bar img, #send img { position: static; height: 100%; }
      #send { position: absolute; inset: 0; }

      .touch { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; }
      .touch-dot { position: absolute; inset: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.42); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.7); }
      .touch-ring { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--accent); }

      /* A band of the ground behind the captions while the camera is close on the phone. */
      #veil { position: absolute; left: 0; right: 0; top: 0; height: 236px; background: linear-gradient(180deg, var(--ground) 0px, var(--ground) 214px, rgba(11, 11, 13, 0) 236px); }

      #caps { position: absolute; left: 0; right: 0; top: 112px; height: 100px; }
      .cap {
        position: absolute; left: 0; right: 0; top: 0; text-align: center; color: var(--ink);
        font-size: 80px; line-height: 1; font-weight: 500; letter-spacing: -0.035em; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1200">
      <div id="light"></div>

      <div id="camera">
        <div id="photo"><img src="assets/img/storefront.webp" alt="" /></div>

        <div id="phone" data-layout-allow-overflow>
          <div class="screen" data-layout-allow-overflow>
            <div id="page2" class="page" data-layout-allow-overflow>
              <div id="strip" data-layout-allow-overflow>
                <img id="e0" src="assets/img/booking-E0-empty.webp" alt="" />
                <img id="e1" src="assets/img/booking-E1-barber.webp" alt="" />
                <img id="e2" src="assets/img/booking-E2-service.webp" alt="" />
                <img id="e3" src="assets/img/booking-E3-date.webp" alt="" />
                <img id="e4" src="assets/img/booking-E4-time.webp" alt="" />
              </div>
              <div id="bar"><img src="assets/img/call-bar.webp" alt="" /></div>
              <div id="send"><img src="assets/img/booking-send-mobile.webp" alt="" /></div>
            </div>
            <div id="home" class="page"><img src="assets/img/home-mobile.webp" alt="" /></div>

            <!-- Taps, in screen pixels: Book Now, barber, service, date, 11:00 AM, Confirm Booking, Send via Text Message. -->
            <div id="t-book" class="touch" style="left: 200.7px; top: 548.8px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            <div id="t-barber" class="touch" style="left: 198.7px; top: 452.9px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            <div id="t-service" class="touch" style="left: 198.7px; top: 418.3px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            <div id="t-date" class="touch" style="left: 198.7px; top: 515.1px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            <div id="t-slot" class="touch" style="left: 303.4px; top: 646.6px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            <div id="t-confirm" class="touch" style="left: 198.7px; top: 699.6px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            <div id="t-text" class="touch" style="left: 198.7px; top: 740.8px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
          </div>
        </div>
      </div>

      <div id="veil"></div>
      <div id="caps">
        <div id="cap-1" class="cap">Pick your barber</div>
        <div id="cap-2" class="cap">Open-hours slots</div>
        <div id="cap-3" class="cap">Text to book</div>
      </div>
    </div>

    <script>
      // Authored constants only, no layout reads at tween time.
      const K = 1.019; // screen px per CSS px
      const SCREEN_H = 860;
      const P1 = -330 * K; // strip scroll that shows service, date and the time slots
      const P2 = -716 * K; // strip scroll that shows Confirm Booking
      const STATES = ["#e1", "#e2", "#e3", "#e4"];
      // A camera pose that puts layout point (cx, cy) at the frame centre at scale s. The phone screen's top left is layout (1116, 278).
      const pose = (cx, cy, s) => ({ scale: s, x: -s * (cx - 960), y: -s * (cy - 600) });
      const B2 = pose(1314.7, 786.7, 2.3); // the phone screen from the service to the time slots, under the caption band
      const B3 = pose(1314.7, 931.7, 2.3); // Confirm Booking, then the send buttons

      // Rest state at t=0: the photo and the phone on the home page. Every channel is back here by t=12.
      gsap.set("#camera", { x: 0, y: 0, scale: 1 });
      gsap.set("#home", { y: 0 });
      gsap.set("#page2", { y: SCREEN_H });
      gsap.set("#strip", { y: 0 });
      gsap.set(STATES, { opacity: 0 });
      gsap.set("#send", { opacity: 0 });
      gsap.set(".touch", { opacity: 0, scale: 0.6 });
      gsap.set(".touch-ring", { scale: 1, opacity: 0 });
      gsap.set("#photo", { x: 0, opacity: 1 });
      gsap.set("#veil", { opacity: 0 });

      const tl = gsap.timeline({ paused: true });
      const capIn = (id, at) => tl.fromTo(id, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.72, ease: "expo.out" }, at);
      const capOut = (id, at) => tl.to(id, { y: -12, opacity: 0, duration: 0.32, ease: "power2.in" }, at);
      const cam = (v, at, duration, ease) => tl.to("#camera", { ...v, duration, ease }, at);

      // A tap on the phone: the dot lands and presses, an accent ring opens, then the page answers.
      function tap(touch, at, target, duration = 0.2) {
        tl.to(touch, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, at)
          .to(touch, { scale: 0.84, duration: 0.1, ease: "power2.in" }, at + 0.24)
          .fromTo(`${touch} .touch-ring`, { scale: 1, opacity: 0.9 }, { scale: 2.3, opacity: 0, duration: 0.48, ease: "power2.out", immediateRender: false }, at + 0.32)
          .to(touch, { opacity: 0, scale: 1, duration: 0.25, ease: "power1.in" }, at + 0.46);
        if (target) tl.to(target, { opacity: 1, duration, ease: "power1.out" }, at + 0.4);
      }

      // Beat 1 (0 to 3.8s): Book Now takes the phone to the booking form, and a barber is picked.
      capIn("#cap-1", 0.5);
      cam({ scale: 1.04, x: -40, y: 0 }, 0.6, 3.0, "sine.inOut");
      tap("#t-book", 0.9);
      tl.to("#home", { y: -SCREEN_H, duration: 0.75, ease: "power3.inOut" }, 1.3)
        .to("#page2", { y: 0, duration: 0.75, ease: "power3.inOut" }, 1.3);
      tap("#t-barber", 2.3, "#e1");
      capOut("#cap-1", 3.55);

      // Beat 2 (3.8 to 7.7s): the phone fills the frame, a service, a date, and an open 30-minute slot.
      cam(B2, 3.75, 1.1, "power3.inOut");
      tl.to("#photo", { x: -420, opacity: 0, duration: 0.9, ease: "power3.in" }, 3.75)
        .to("#veil", { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 3.8);
      capIn("#cap-2", 4.3);
      tl.to("#strip", { y: P1, duration: 0.65, ease: "power2.inOut" }, 4.05);
      tap("#t-service", 4.85, "#e2");
      tap("#t-date", 5.6, "#e3");
      tap("#t-slot", 6.45, "#e4");
      capOut("#cap-2", 7.45);

      // Beat 3 (7.7 to 12s): Confirm Booking, then the send buttons, and the text message option is tapped.
      tl.to("#strip", { y: P2, duration: 0.6, ease: "power2.inOut" }, 7.6);
      cam(B3, 7.55, 0.8, "power3.inOut");
      capIn("#cap-3", 7.9);
      tap("#t-confirm", 8.3, "#send", 0.3);
      cam(pose(1314.7, 936, 2.33), 8.4, 1.6, "sine.inOut");
      tap("#t-text", 9.45);
      capOut("#cap-3", 10.55);
      cam({ scale: 1, x: 0, y: 0 }, 10.55, 1.0, "power3.inOut");
      tl.to("#veil", { opacity: 0, duration: 0.45, ease: "power1.inOut" }, 10.6)
        .to("#photo", { x: 0, opacity: 1, duration: 0.9, ease: "power3.out" }, 10.75);
      tl.to("#home", { y: 0, duration: 0.75, ease: "power3.inOut" }, 10.75)
        .to("#page2", { y: SCREEN_H, duration: 0.75, ease: "power3.inOut" }, 10.75)
        // The booking page is off the screen now, so it goes back to its t=0 state.
        .set("#strip", { y: 0 }, 11.6)
        .set(STATES, { opacity: 0 }, 11.6)
        .set("#send", { opacity: 0 }, 11.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
