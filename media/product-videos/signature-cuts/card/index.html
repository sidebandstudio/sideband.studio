<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, height=1080" />
    <title>Signature Cuts 413 card loop</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 500; src: url("assets/fonts/HankenGrotesk-latin-var.woff2") format("woff2"); }
      :root { --ground: #0b0b0d; --surface-2: #1b1b1f; --ink: #f3f2ef; --accent: #d4c5b0; --site: #050505; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1440px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: "Hanken Grotesk", sans-serif; }

      #light {
        position: absolute; inset: 0;
        background:
          radial-gradient(60% 55% at 50% 38%, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 70%),
          radial-gradient(40% 18% at 50% 96%, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0) 100%);
      }
      #camera { position: absolute; inset: 0; transform-origin: 50% 50%; }

      /* The hero's phone, centred. The camera follows the booking down its screen. */
      #phone {
        position: absolute; left: 505.3px; top: 94px; width: 429.4px; height: 892px; padding: 16px; border-radius: 58px;
        background: var(--surface-2); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.07), 0 50px 90px -30px rgba(0, 0, 0, 0.9);
      }
      .screen { position: relative; width: 397.4px; height: 860px; border-radius: 42px; overflow: hidden; background: var(--site); }
      #form { position: absolute; inset: 0; }
      #strip { position: absolute; left: 0; top: 0; width: 397.4px; height: 1589.7px; }
      #strip img { position: absolute; left: 0; top: 0; display: block; width: 397.4px; height: 1589.7px; }
      #bar { position: absolute; left: 0; bottom: 0; width: 397.4px; height: 63.2px; }
      #send { position: absolute; inset: 0; }
      #bar img, #send img { display: block; width: 100%; height: 100%; }

      .touch { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; }
      .touch-dot { position: absolute; inset: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.42); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.7); }
      .touch-ring { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--accent); }

      /* Keeps the caption band dark: the site's black page fades into the ground under the caption. */
      #veil { position: absolute; left: 0; right: 0; top: 0; height: 250px; background: linear-gradient(180deg, var(--ground) 0, var(--ground) 150px, rgba(11, 11, 13, 0) 240px); }
      #cap {
        position: absolute; left: 0; right: 0; top: 64px; text-align: center; color: var(--ink);
        font-size: 84px; line-height: 1; font-weight: 500; letter-spacing: -0.035em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1440" data-height="1080">
      <div id="light"></div>

      <div id="camera">
        <div id="phone" data-layout-allow-overflow>
          <div class="screen" data-layout-allow-overflow>
            <div id="form" data-layout-allow-overflow>
              <div id="strip" data-layout-allow-overflow>
                <img id="e3" src="assets/img/booking-E3-date.webp" alt="" />
                <img id="e4" src="assets/img/booking-E4-time.webp" alt="" />
              </div>
              <div id="bar"><img src="assets/img/call-bar.webp" alt="" /></div>
            </div>
            <div id="send" data-layout-allow-overflow><img src="assets/img/booking-send-mobile.webp" alt="" /></div>

            <div id="t-slot" class="touch" style="left: 303.4px; top: 646.6px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            <div id="t-confirm" class="touch" style="left: 198.7px; top: 699.6px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            <div id="t-text" class="touch" style="left: 198.7px; top: 740.8px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
          </div>
        </div>
      </div>

      <div id="veil"></div>
      <div id="cap">Text to book</div>
    </div>

    <script>
      const K = 1.019;
      const P1 = -330 * K;
      const P2 = -716 * K;
      // Camera poses at scale 1.75: the time slots, Confirm Booking, then the send buttons.
      const SCREEN_H = 860;
      const A = { scale: 1.75, x: 0, y: -202 };
      const B = { scale: 1.75, x: 0, y: -132 };
      const C = { scale: 1.75, x: 0, y: -300 };

      // Rest state at t=0: service and date chosen, the open slots showing. Back here by t=7.
      gsap.set("#camera", A);
      gsap.set("#strip", { y: P1 });
      gsap.set(["#e4", "#send"], { opacity: 0 });
      gsap.set(["#form", "#send"], { y: 0 });
      gsap.set(".touch", { opacity: 0, scale: 0.6 });
      gsap.set(".touch-ring", { scale: 1, opacity: 0 });

      const tl = gsap.timeline({ paused: true });
      function tap(touch, at, target, duration = 0.2) {
        tl.to(touch, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, at)
          .to(touch, { scale: 0.84, duration: 0.1, ease: "power2.in" }, at + 0.24)
          .fromTo(`${touch} .touch-ring`, { scale: 1, opacity: 0.9 }, { scale: 2.3, opacity: 0, duration: 0.48, ease: "power2.out", immediateRender: false }, at + 0.32)
          .to(touch, { opacity: 0, scale: 1, duration: 0.25, ease: "power1.in" }, at + 0.46);
        if (target) tl.to(target, { opacity: 1, duration, ease: "power1.out" }, at + 0.4);
      }

      tap("#t-slot", 0.45, "#e4");
      tl.to("#strip", { y: P2, duration: 0.6, ease: "power2.inOut" }, 1.35)
        .to("#camera", { ...B, duration: 0.8, ease: "power2.inOut" }, 1.3);
      tap("#t-confirm", 2.25, "#send", 0.3);
      tl.to("#camera", { ...C, duration: 0.9, ease: "power2.inOut" }, 2.7);
      tap("#t-text", 3.75);
      // Back up to the slots. Under the send screen the form returns to its opening state, waiting above the
      // screen, then both pages slide down together like a scroll back up.
      tl.set("#strip", { y: P1 }, 5.3)
        .set("#e4", { opacity: 0 }, 5.3)
        .set("#form", { y: -SCREEN_H }, 5.3)
        .to("#send", { y: SCREEN_H, duration: 0.8, ease: "power3.inOut" }, 5.45)
        .to("#form", { y: 0, duration: 0.8, ease: "power3.inOut" }, 5.45)
        .to("#camera", { ...A, duration: 1.1, ease: "power2.inOut" }, 5.4)
        .set("#send", { opacity: 0, y: 0 }, 6.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
