<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>Eternal Summary product loop</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 500; src: url("assets/fonts/HankenGrotesk-latin-var.woff2") format("woff2"); }
      :root { --ground: #0b0b0d; --surface-2: #1b1b1f; --surface-3: #25252a; --ink: #f3f2ef; --accent: #7b8cff; --page: #fcfaf8; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1200px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: "Hanken Grotesk", sans-serif; }

      /* One soft light from above (the site's spotlight backdrop) and a little floor shade. */
      #light {
        position: absolute; inset: 0;
        background:
          radial-gradient(60% 55% at 50% 38%, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 70%),
          radial-gradient(40% 18% at 50% 96%, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0) 100%);
      }
      #camera { position: absolute; inset: 0; transform-origin: 50% 50%; }

      /* Browser window. The screen is the screenshots' own 2720x1720 aspect, 0.48824 px per image px. */
      #win {
        position: absolute; left: 280px; top: 250px; width: 1360px; padding: 0 16px 16px;
        border-radius: 20px; background: var(--surface-2);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 40px 80px -40px rgba(0, 0, 0, 0.8);
      }
      .win-bar { display: flex; align-items: center; gap: 9px; height: 44px; padding-left: 6px; }
      .win-bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--surface-3); }
      .screen { position: relative; width: 1328px; height: 839.8px; border-radius: 8px; overflow: hidden; background: var(--page); }
      /* Three real screenshots of the extension, whole and unaltered: summary, bullets added, a follow-up answered. */
      .screen img { position: absolute; left: 0; top: 0; display: block; width: 1328px; height: 839.8px; }

      .touch { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; }
      .touch-dot { position: absolute; inset: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.42); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.7), 0 0 0 1px rgba(0, 0, 0, 0.08); }
      .click { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--accent); }
      /* Highlight on the answer's source, "Sources 1" (image x 1905 to 2095, y 1540 to 1594). */
      #ring { position: absolute; left: 930px; top: 752px; width: 93px; height: 26px; border-radius: 13px; box-shadow: 0 0 0 1.5px var(--accent); }

      /* A band of the ground behind the captions while the camera is close on the panel. */
      #veil { position: absolute; left: 0; right: 0; top: 0; height: 236px; background: linear-gradient(180deg, var(--ground) 0px, var(--ground) 214px, rgba(11, 11, 13, 0) 236px); }

      #caps { position: absolute; left: 0; right: 0; top: 112px; height: 100px; }
      .cap {
        position: absolute; left: 0; right: 0; top: 0; text-align: center; color: var(--ink);
        font-size: 80px; line-height: 1; font-weight: 500; letter-spacing: -0.035em; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1200">
      <div id="light"></div>

      <div id="camera">
        <div id="win">
          <div class="win-bar"><i></i><i></i><i></i></div>
          <div class="screen" data-layout-allow-overflow>
            <img id="s-summary" src="assets/img/panel-beside-article.webp" alt="" />
            <img id="s-bullets" src="assets/img/bullets-mode.webp" alt="" />
            <img id="s-chat" src="assets/img/follow-up-chat.webp" alt="" />
            <!-- Taps on the Bullets tab and the "Ask about this page" box, in screen pixels. -->
            <div id="t-bullets" class="touch" style="left: 1070px; top: 160px"><div class="touch-dot"></div></div>
            <div id="c-bullets" class="click" style="left: 1070px; top: 160px"></div>
            <div id="t-ask" class="touch" style="left: 1000px; top: 814px"><div class="touch-dot"></div></div>
            <div id="c-ask" class="click" style="left: 1000px; top: 814px"></div>
            <div id="ring"></div>
          </div>
        </div>
      </div>

      <div id="veil"></div>
      <div id="caps">
        <div id="cap-1" class="cap">One-click page summary</div>
        <div id="cap-2" class="cap">Four styles</div>
        <div id="cap-3" class="cap">Follow-up questions</div>
      </div>
    </div>

    <script>
      // Authored constants only, no layout reads at tween time.
      // A camera pose that puts layout point (cx, cy) at the frame centre at scale s.
      // Screenshot pixel (ox, oy) sits at layout (296 + 0.48824 * ox, 294 + 0.48824 * oy); the panel starts at ox 1860.
      const pose = (cx, cy, s) => ({ scale: s, x: -s * (cx - 960), y: -s * (cy - 600) });
      const A = pose(740, 575, 2.2); // the article's head, the panel just past the right edge
      const W = pose(960, 600, 1); // the whole window, article and panel
      const P2 = pose(1414, 476, 2.0); // the panel's header, verdict and style tabs
      const P2B = pose(1414, 560, 2.0); // the bullets added below the summary
      const P3 = pose(1414, 857, 2.0); // the "Ask about this page" box
      const P3B = pose(1419, 890, 3.1); // the question, its answer and its source

      // Rest state at t=0: close on the article, summary screenshot on top. Every channel is back here by t=12.
      gsap.set("#camera", A);
      gsap.set("#s-summary", { opacity: 1 });
      gsap.set(["#s-bullets", "#s-chat"], { opacity: 0 });
      gsap.set([".touch", ".click"], { opacity: 0, scale: 0.6 });
      gsap.set("#ring", { opacity: 0, scale: 0.92 });
      gsap.set("#veil", { opacity: 0 });

      const tl = gsap.timeline({ paused: true });
      const capIn = (id, at) => tl.fromTo(id, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.72, ease: "expo.out" }, at);
      const capOut = (id, at) => tl.to(id, { y: -12, opacity: 0, duration: 0.32, ease: "power2.in" }, at);
      const cam = (v, at, duration, ease) => tl.to("#camera", { ...v, duration, ease }, at);

      // A click in the panel: a dot lands, presses, and an accent ring opens, then the next screenshot comes up.
      function tap(touch, click, at, to) {
        tl.to(touch, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, at)
          .to(touch, { scale: 0.84, duration: 0.1, ease: "power2.in" }, at + 0.24)
          .to(touch, { opacity: 0, scale: 1, duration: 0.25, ease: "power1.in" }, at + 0.46)
          .fromTo(click, { opacity: 1, scale: 0.5 }, { opacity: 0, scale: 1.6, duration: 0.52, ease: "power2.out", immediateRender: false }, at + 0.32)
          .to(to, { opacity: 1, duration: 0.35, ease: "power1.inOut" }, at + 0.42);
      }

      // Beat 1 (0 to 3.9s): from the article, the camera pulls back to the summary panel beside it.
      cam(W, 0.5, 1.4, "power3.inOut");
      capIn("#cap-1", 1.35);
      cam(pose(1010, 600, 1.06), 1.9, 1.9, "sine.inOut");
      capOut("#cap-1", 3.6);

      // Beat 2 (3.9 to 7.3s): close on the panel, Bullets is added below the summary.
      cam(P2, 3.85, 1.1, "power3.inOut");
      tl.to("#veil", { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 4.0);
      capIn("#cap-2", 4.25);
      tap("#t-bullets", "#c-bullets", 5.0, "#s-bullets");
      cam(P2B, 5.6, 1.4, "sine.inOut");
      capOut("#cap-2", 7.0);

      // Beat 3 (7.3 to 10.4s): the question box, then close enough to read the question, the answer and its source.
      cam(P3, 7.1, 0.9, "power3.inOut");
      capIn("#cap-3", 7.55);
      tap("#t-ask", "#c-ask", 7.95, "#s-chat");
      cam(P3B, 8.55, 1.0, "power3.inOut");
      cam(pose(1421, 894, 3.14), 9.55, 0.95, "sine.inOut");
      tl.to("#ring", { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 9.45)
        .to("#ring", { opacity: 0, duration: 0.3, ease: "power1.in" }, 10.35);
      capOut("#cap-3", 10.3);

      // Back to the article. Left of the panel the three screenshots are the same page, so they change there unseen.
      cam(A, 10.5, 1.3, "power3.inOut");
      tl.to("#veil", { opacity: 0, duration: 0.45, ease: "power1.inOut" }, 10.75)
        .set(["#s-bullets", "#s-chat"], { opacity: 0 }, 11.85);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
