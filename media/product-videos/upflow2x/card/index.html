<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, height=1080" />
    <title>Upflow2x card loop</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 500; src: url("assets/fonts/HankenGrotesk-latin-var.woff2") format("woff2"); }
      :root { --ground: #0b0b0d; --ink: #f3f2ef; --accent: #7c6fef; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1440px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: "Hanken Grotesk", sans-serif; }

      #light {
        position: absolute; inset: 0;
        background:
          radial-gradient(60% 55% at 50% 55%, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 70%),
          radial-gradient(40% 18% at 50% 96%, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0) 100%);
      }
      #camera { position: absolute; inset: 0; transform-origin: 50% 58%; }

      /* The film's own comparison, played back at half speed: the Hero walk as drawn left of the divider and from Upflow2x right of it.
         The clip is the film's picture (1920x712); this window shows 1120 px of it around the divider at 1.2x, so the divider sits at x 720. */
      #compare { position: absolute; left: 48px; top: 196px; width: 1344px; height: 854.4px; border-radius: 12px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 50px 90px -30px rgba(0, 0, 0, 0.9); }
      #walk { position: absolute; left: -479px; top: 0; width: 2304px; height: 854.4px; max-width: none; }
      .vlabel { position: absolute; top: 80px; width: 640px; margin-left: -320px; text-align: center; color: var(--ink); font-size: 84px; line-height: 1; font-weight: 500; letter-spacing: -0.035em; }
      #label-drawn { left: 384px; }
      #label-up { left: 1056px; color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="card" data-start="0" data-duration="7" data-width="1440" data-height="1080">
      <div id="light"></div>
      <div id="camera">
        <div id="compare">
          <video id="walk" class="clip" src="assets/video/hero-walk-compare.mp4" data-start="0" data-duration="7" data-track-index="1" muted playsinline></video>
        </div>
      </div>
      <div id="label-drawn" class="vlabel">As drawn</div>
      <div id="label-up" class="vlabel">From Upflow2x</div>
    </div>

    <script>
      // The clip is three passes of the same 56 frames (2.33 s each), so the loop wraps where each pass does.
      gsap.set("#camera", { scale: 1 });

      const tl = gsap.timeline({ paused: true });
      tl.to("#camera", { scale: 1.02, duration: 3.3, ease: "sine.inOut" }, 0.2)
        .to("#camera", { scale: 1, duration: 3.3, ease: "sine.inOut" }, 3.6);

      window.__timelines["card"] = tl;
    </script>
  </body>
</html>
