<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, height=1080" />
    <title>Fade Empire card loop</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 500; src: url("assets/fonts/HankenGrotesk-latin-var.woff2") format("woff2"); }
      :root { --ground: #0b0b0d; --surface-2: #1b1b1f; --ink: #f3f2ef; --accent: #c8a24a; --site: #0a0908; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1440px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: "Hanken Grotesk", sans-serif; }

      #light {
        position: absolute; inset: 0;
        background:
          radial-gradient(60% 55% at 50% 38%, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 70%),
          radial-gradient(40% 18% at 50% 96%, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0) 100%);
      }
      #camera { position: absolute; inset: 0; transform-origin: 50% 50%; }

      /* The hero's phone, centred. The camera holds on the barbers, the days and the slots. */
      #phone {
        position: absolute; left: 505.3px; top: 94px; width: 429.4px; height: 892px; padding: 16px; border-radius: 58px;
        background: var(--surface-2); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.07), 0 50px 90px -30px rgba(0, 0, 0, 0.9);
      }
      .screen { position: relative; width: 397.4px; height: 860px; border-radius: 42px; overflow: hidden; background: var(--site); }
      #strip { position: absolute; left: 0; top: 0; width: 397.4px; height: 1528.5px; }
      #strip img { position: absolute; left: 0; top: 0; display: block; width: 397.4px; height: 1528.5px; }

      .touch { position: absolute; width: 50px; height: 50px; margin: -25px 0 0 -25px; }
      .touch-dot { position: absolute; inset: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.42); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.7); }
      .touch-ring { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--accent); }

      /* Keeps the caption band dark: the site's page fades into the ground under the caption. */
      #veil { position: absolute; left: 0; right: 0; top: 0; height: 250px; background: linear-gradient(180deg, var(--ground) 0, var(--ground) 170px, rgba(11, 11, 13, 0) 236px); }
      #cap {
        position: absolute; left: 0; right: 0; top: 64px; text-align: center; color: var(--ink);
        font-size: 88px; line-height: 1; font-weight: 500; letter-spacing: -0.035em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1440" data-height="1080">
      <div id="light"></div>

      <div id="camera">
        <div id="phone" data-layout-allow-overflow>
          <div class="screen" data-layout-allow-overflow>
            <div id="strip" data-layout-allow-overflow>
              <img id="s0" src="assets/img/book-S0.webp" alt="" />
              <img id="s1" src="assets/img/book-S1.webp" alt="" />
              <img id="s2" src="assets/img/book-S2.webp" alt="" />
              <img id="s3" src="assets/img/book-S3.webp" alt="" />
            </div>

            <!-- Taps, in screen pixels at the strip's scroll: Larry, Thu 29, 1:00 PM, Hassan. -->
            <div id="t-larry" class="touch" style="left: 198.7px; top: 239.5px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            <div id="t-day" class="touch" style="left: 219.1px; top: 374px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            <div id="t-slot" class="touch" style="left: 198.7px; top: 562.5px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            <div id="t-hassan" class="touch" style="left: 198.7px; top: 147.8px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
          </div>
        </div>
      </div>

      <div id="veil"></div>
      <div id="cap">Pick a barber, a day, a time</div>
    </div>

    <script>
      const K = 1.019;
      const P1 = -300 * K; // the barbers, the days and the slots
      // Two camera poses at 1.85. A: the barbers and the days, strip CSS y 400 at frame y 215.
      // B: the days and the slots, strip CSS y 1005 at frame y 1060. Layout y of strip CSS c is 110 + (c - 300) * K.
      const A = { scale: 1.85, x: 0, y: 282 };
      const B = { scale: 1.85, x: 0, y: -13.5 };
      const STATES = ["#s1", "#s2", "#s3"];

      // Rest state at t=0: Hassan, Wednesday, no time picked. Back here by t=7.
      gsap.set("#camera", A);
      gsap.set("#strip", { y: P1 });
      gsap.set(STATES, { opacity: 0 });
      gsap.set(".touch", { opacity: 0, scale: 0.6 });
      gsap.set(".touch-ring", { scale: 1, opacity: 0 });

      const tl = gsap.timeline({ paused: true });
      function tap(touch, at, target, to = 1, duration = 0.2) {
        tl.to(touch, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, at)
          .to(touch, { scale: 0.84, duration: 0.1, ease: "power2.in" }, at + 0.24)
          .fromTo(`${touch} .touch-ring`, { scale: 1, opacity: 0.9 }, { scale: 2.3, opacity: 0, duration: 0.48, ease: "power2.out", immediateRender: false }, at + 0.32)
          .to(touch, { opacity: 0, scale: 1, duration: 0.25, ease: "power1.in" }, at + 0.46);
        if (target) tl.to(target, { opacity: to, duration, ease: "power1.out" }, at + 0.4);
      }

      tap("#t-larry", 0.35, "#s1");
      tap("#t-day", 1.3, "#s2");
      tl.to("#camera", { ...B, duration: 0.9, ease: "power2.inOut" }, 2.0);
      tap("#t-slot", 3.0, "#s3");
      tl.to("#camera", { ...A, duration: 0.9, ease: "power2.inOut" }, 4.15);
      // Tapping Hassan puts the live form back to its opening state (Wednesday, no time). S1 and S2 drop while S3 still
      // covers them, then S3 fades to show S0.
      tl.set(["#s1", "#s2"], { opacity: 0 }, 5.25);
      tap("#t-hassan", 5.15, "#s3", 0);
      // A small breath on the camera, ending where it began.
      tl.to("#camera", { scale: 1.87, y: 286, duration: 0.6, ease: "sine.inOut" }, 5.65)
        .to("#camera", { ...A, duration: 0.57, ease: "sine.inOut" }, 6.25);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
