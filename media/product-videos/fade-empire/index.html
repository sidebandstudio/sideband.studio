<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>Fade Empire product loop</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 500; src: url("assets/fonts/HankenGrotesk-latin-var.woff2") format("woff2"); }
      :root { --ground: #0b0b0d; --surface-2: #1b1b1f; --surface-3: #25252a; --ink: #f3f2ef; --accent: #c8a24a; --site: #0a0908; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1200px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: "Hanken Grotesk", sans-serif; }

      #light {
        position: absolute; inset: 0;
        background:
          radial-gradient(60% 55% at 50% 38%, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 70%),
          radial-gradient(40% 18% at 50% 96%, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0) 100%);
      }
      #camera { position: absolute; inset: 0; transform-origin: 50% 50%; }

      /* PC monitor. The screen is the desktop capture's 1440x900 aspect. */
      #pc { position: absolute; left: 300px; top: 300px; width: 1032px; will-change: transform, opacity; }
      .pc-body {
        position: relative; z-index: 1; width: 1032px; height: 657px; padding: 16px;
        border-radius: 20px; background: var(--surface-2);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 40px 80px -40px rgba(0, 0, 0, 0.8);
      }
      .pc-screen { position: relative; width: 1000px; height: 625px; border-radius: 8px; overflow: hidden; background: var(--site); }
      .pc-screen img { display: block; width: 1000px; height: 625px; }
      .pc-neck { width: 132px; height: 92px; margin: -6px auto 0; background: linear-gradient(180deg, #141417 0%, #1d1d21 100%); }
      .pc-base { width: 330px; height: 14px; margin: 0 auto; border-radius: 7px; background: var(--surface-3); }

      /* Phones. The site's screen is a 390x844 CSS px viewport at 1.019 px per CSS px. The barber app's screen is its 1178x2556 capture. */
      .phone {
        position: absolute; width: 429.4px; padding: 16px; border-radius: 58px;
        background: var(--surface-2); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.07), 0 50px 90px -30px rgba(0, 0, 0, 0.9);
      }
      #phone { left: 1190px; top: 262px; height: 892px; z-index: 2; }
      #app { left: 700px; top: 262px; height: 894.3px; z-index: 2; }
      .screen { position: relative; width: 397.4px; height: 860px; border-radius: 42px; overflow: hidden; background: var(--site); }
      #app .screen { height: 862.3px; background: #000; }
      .page { position: absolute; left: 0; top: 0; width: 397.4px; height: 860px; }
      .page img, #app .screen img { position: absolute; left: 0; top: 0; display: block; width: 397.4px; }
      #app .screen img { height: 862.3px; }
      /* The booking section as one strip per form state, scrolled by moving the strip. */
      #strip { position: absolute; left: 0; top: 0; width: 397.4px; height: 1528.5px; }
      #strip img { height: 1528.5px; }
      #nav { position: absolute; left: 0; top: 0; width: 397.4px; height: 58.1px; }
      #nav img { height: 100%; }

      .touch { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; }
      .touch-dot { position: absolute; inset: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.42); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.7); }
      .touch-ring { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--accent); }

      /* A band of the ground behind the captions while the camera is close on the phone. */
      #veil { position: absolute; left: 0; right: 0; top: 0; height: 236px; background: linear-gradient(180deg, var(--ground) 0px, var(--ground) 214px, rgba(11, 11, 13, 0) 236px); }

      #caps { position: absolute; left: 0; right: 0; top: 112px; height: 100px; }
      .cap {
        position: absolute; left: 0; right: 0; top: 0; text-align: center; color: var(--ink);
        font-size: 80px; line-height: 1; font-weight: 500; letter-spacing: -0.035em; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1200">
      <div id="light"></div>

      <div id="camera">
        <div id="pc">
          <div class="pc-body">
            <div class="pc-screen"><img src="assets/img/home-desktop.webp" alt="" /></div>
          </div>
          <div class="pc-neck"></div>
          <div class="pc-base"></div>
        </div>

        <!-- The shop's side: the barber app on the repo's local seed data (no real customers). -->
        <div id="app" class="phone" data-layout-allow-overflow>
          <div class="screen">
            <img src="assets/img/barber-app-schedule.webp" alt="" />
            <img id="app-links" src="assets/img/barber-app-links.webp" alt="" />
            <div id="t-links" class="touch" style="left: 240.9px; top: 809.3px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
          </div>
        </div>

        <div id="phone" class="phone" data-layout-allow-overflow>
          <div class="screen" data-layout-allow-overflow>
            <div id="page2" class="page" data-layout-allow-overflow>
              <div id="strip" data-layout-allow-overflow>
                <img id="s0" src="assets/img/book-S0.webp" alt="" />
                <img id="s1" src="assets/img/book-S1.webp" alt="" />
                <img id="s2" src="assets/img/book-S2.webp" alt="" />
                <img id="s3" src="assets/img/book-S3.webp" alt="" />
                <img id="s5" src="assets/img/book-S5.webp" alt="" />
              </div>
              <div id="nav"><img src="assets/img/nav-mobile.webp" alt="" /></div>
            </div>
            <div id="home" class="page"><img src="assets/img/home-mobile.webp" alt="" /></div>

            <!-- Taps, in screen pixels: Book a chair, Larry, Thu 29, 1:00 PM, Service. -->
            <div id="t-book" class="touch" style="left: 127.4px; top: 809.1px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            <div id="t-larry" class="touch" style="left: 198.7px; top: 239.5px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            <div id="t-day" class="touch" style="left: 219.1px; top: 374px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            <div id="t-slot" class="touch" style="left: 198.7px; top: 562.5px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
            <div id="t-service" class="touch" style="left: 198.7px; top: 597.1px"><div class="touch-ring"></div><div class="touch-dot"></div></div>
          </div>
        </div>
      </div>

      <div id="veil"></div>
      <div id="caps">
        <div id="cap-1" class="cap">Book a chair</div>
        <div id="cap-2" class="cap">Pick a barber, a day, a time</div>
        <div id="cap-3" class="cap">The barber app</div>
      </div>
    </div>

    <script>
      // Authored constants only, no layout reads at tween time.
      const K = 1.019; // screen px per CSS px
      const SCREEN_H = 860;
      const P1 = -300 * K; // strip scroll that shows the barbers, the days and the time slots
      const P2 = -820 * K; // strip scroll that shows the Selected pill and the Service field
      const STATES = ["#s1", "#s2", "#s3", "#s5"];
      const OFF = { x: -260, opacity: 0 }; // where the monitor and the barber app wait off stage
      // A camera pose that puts layout point (cx, cy) at the frame centre at scale s. The site phone's screen top left is layout (1206, 278).
      const pose = (cx, cy, s) => ({ scale: s, x: -s * (cx - 960), y: -s * (cy - 600) });
      const B2 = pose(1404.7, 598, 1.55); // both barbers, the days and the slots, under the caption band
      const B2b = pose(1404.7, 650, 1.6); // the Selected pill and the Service field
      const B3 = { scale: 1, x: -200, y: 0 }; // the two phones, centred

      // Rest state at t=0: the monitor and the phone on the home page. Every channel is back here by t=12.
      gsap.set("#camera", { x: 0, y: 0, scale: 1 });
      gsap.set("#pc", { x: 0, opacity: 1 });
      gsap.set("#app", OFF);
      gsap.set("#app-links", { opacity: 0 });
      gsap.set("#home", { y: 0 });
      gsap.set("#page2", { y: SCREEN_H });
      gsap.set("#strip", { y: 0 });
      gsap.set(STATES, { opacity: 0 });
      gsap.set(".touch", { opacity: 0, scale: 0.6 });
      gsap.set(".touch-ring", { scale: 1, opacity: 0 });
      gsap.set("#veil", { opacity: 0 });

      const tl = gsap.timeline({ paused: true });
      const capIn = (id, at) => tl.fromTo(id, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.72, ease: "expo.out" }, at);
      const capOut = (id, at) => tl.to(id, { y: -12, opacity: 0, duration: 0.32, ease: "power2.in" }, at);
      const cam = (v, at, duration, ease) => tl.to("#camera", { ...v, duration, ease }, at);

      // A tap on a phone: the dot lands and presses, an accent ring opens, then the page answers.
      function tap(touch, at, target, duration = 0.2) {
        tl.to(touch, { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, at)
          .to(touch, { scale: 0.84, duration: 0.1, ease: "power2.in" }, at + 0.24)
          .fromTo(`${touch} .touch-ring`, { scale: 1, opacity: 0.9 }, { scale: 2.3, opacity: 0, duration: 0.48, ease: "power2.out", immediateRender: false }, at + 0.32)
          .to(touch, { opacity: 0, scale: 1, duration: 0.25, ease: "power1.in" }, at + 0.46);
        if (target) tl.to(target, { opacity: 1, duration, ease: "power1.out" }, at + 0.4);
      }

      // Beat 1 (0 to 3.7s): the site on desktop and phone. Book a chair takes the phone to the booking form.
      capIn("#cap-1", 0.5);
      cam({ scale: 1.04, x: -30, y: 0 }, 0.6, 2.9, "sine.inOut");
      tap("#t-book", 1.0);
      tl.to("#home", { y: -SCREEN_H, duration: 0.75, ease: "power3.inOut" }, 1.4)
        .to("#page2", { y: 0, duration: 0.75, ease: "power3.inOut" }, 1.4);
      capOut("#cap-1", 3.3);

      // Beat 2 (3.7 to 7.9s): close on the phone. Larry, Thursday, 1:00 PM, then a Hair Cut.
      cam(B2, 3.6, 1.1, "power3.inOut");
      tl.to("#pc", { x: -120, opacity: 0, duration: 0.8, ease: "power3.in" }, 3.6)
        .to("#veil", { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 3.75)
        .to("#strip", { y: P1, duration: 0.65, ease: "power2.inOut" }, 3.85);
      capIn("#cap-2", 4.15);
      tap("#t-larry", 4.6, "#s1");
      tap("#t-day", 5.3, "#s2");
      tap("#t-slot", 6.0, "#s3");
      tl.to("#strip", { y: P2, duration: 0.6, ease: "power2.inOut" }, 6.7);
      cam(B2b, 6.7, 1.0, "sine.inOut");
      tap("#t-service", 7.2, "#s5");
      capOut("#cap-2", 7.65);

      // Beat 3 (7.9 to 12s): the shop's side. The barber app slides in beside the phone, and Links is tapped.
      cam(B3, 7.8, 1.1, "power3.inOut");
      tl.to("#veil", { opacity: 0, duration: 0.45, ease: "power1.inOut" }, 7.85)
        .set("#pc", OFF, 7.9)
        .to("#app", { x: 0, opacity: 1, duration: 1.0, ease: "expo.out" }, 8.05);
      capIn("#cap-3", 8.25);
      tap("#t-links", 9.35, "#app-links", 0.12);
      capOut("#cap-3", 10.55);
      cam({ scale: 1, x: 0, y: 0 }, 10.6, 1.05, "power3.inOut");
      tl.to("#app", { ...OFF, duration: 0.45, ease: "power2.in" }, 10.55)
        .to("#pc", { x: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 11.0)
        .to("#home", { y: 0, duration: 0.75, ease: "power3.inOut" }, 10.7)
        .to("#page2", { y: SCREEN_H, duration: 0.75, ease: "power3.inOut" }, 10.7)
        // Hidden now, so back to their t=0 states.
        .set("#app-links", { opacity: 0 }, 11.4)
        .set("#strip", { y: 0 }, 11.6)
        .set(STATES, { opacity: 0 }, 11.6)
        // The touch dots and captions are invisible, but their transforms go back too so the seam frame matches exactly.
        .set(".touch", { scale: 0.6 }, 11.6)
        .set(".touch-ring", { scale: 1 }, 11.6)
        .set(".cap", { y: 24 }, 11.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
