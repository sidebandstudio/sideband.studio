<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, height=1080" />
    <title>Better Canvas card loop</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400 500; src: url("assets/fonts/HankenGrotesk-latin-var.woff2") format("woff2"); }
      :root { --ground: #0b0b0d; --surface-2: #1b1b1f; --ink: #f3f2ef; --accent: #f93d54; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1440px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: "Hanken Grotesk", sans-serif; }
      #light { position: absolute; inset: 0; background: radial-gradient(60% 55% at 50% 45%, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 70%); }

      /* The settings page cropped to its Edit Canvas header, tabs, sample preview and theme gallery
         (page x 180 to 1415, y 80 to 885) at 1.1x, so it reads as the extension's own preview. */
      #panel { position: absolute; left: 41px; top: 180px; width: 1358px; height: 886px; border-radius: 18px; overflow: hidden; background: #111; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.06), 0 50px 100px -40px rgba(0, 0, 0, 0.9); }
      #zoom { position: absolute; inset: 0; transform-origin: 0 0; } /* the breath grows right and down, so the header never clips */
      .page { position: absolute; left: -198px; top: -88px; width: 1440px; height: 900px; transform: scale(1.1); transform-origin: 0 0; }
      .state { position: absolute; inset: 0; display: block; width: 1440px; height: 900px; }
      #cursor { position: absolute; left: 0; top: 0; width: 30px; height: 30px; z-index: 5; }
      #cursor svg { display: block; width: 30px; height: 30px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35)); }
      .click { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--accent); z-index: 4; }

      #cap {
        position: absolute; left: 0; right: 0; top: 54px; text-align: center; color: var(--ink);
        font-size: 84px; line-height: 1; font-weight: 500; letter-spacing: -0.035em; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="card" data-start="0" data-duration="7" data-width="1440" data-height="1080">
      <div id="light"></div>
      <div id="panel">
        <div id="zoom">
          <div class="page">
            <img id="st-themes" class="state" src="assets/img/bc-dark-themes.webp" alt="" />
            <img id="st-forest" class="state" src="assets/img/bc-dark-forest.webp" alt="" />
            <img id="st-sakura" class="state" src="assets/img/bc-dark-sakura.webp" alt="" />
            <div id="click-forest" class="click" style="left: 1004px; top: 640px"></div>
            <div id="click-sakura" class="click" style="left: 1268px; top: 640px"></div>
            <div id="click-cancel" class="click" style="left: 686px; top: 846px"></div>
            <div id="cursor">
              <svg viewBox="0 0 30 30" aria-hidden="true"><path d="M4 2 L4 24 L9.6 18.8 L13.4 27.4 L17.2 25.8 L13.5 17.4 L21 17.2 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round" /></svg>
            </div>
          </div>
        </div>
      </div>
      <div id="cap">Theme packs</div>
    </div>

    <script>
      const REST = { x: 1150, y: 520 }; // where the pointer waits, and returns to

      // Rest state at t=0: the theme gallery with the plain sample preview. Every channel is back here by t=7.
      gsap.set(["#st-forest", "#st-sakura"], { opacity: 0 });
      gsap.set("#cursor", { x: REST.x, y: REST.y });
      gsap.set(".click", { opacity: 0, scale: 0.5 });
      gsap.set("#zoom", { scale: 1 });

      const tl = gsap.timeline({ paused: true });
      function click(id, x, y, at, travel, show, hide) {
        tl.to("#cursor", { x, y, duration: travel, ease: "power3.inOut" }, at - travel)
          .to("#cursor", { scale: 0.86, duration: 0.08, ease: "power2.in", transformOrigin: "4px 2px" }, at)
          .to("#cursor", { scale: 1, duration: 0.14, ease: "power2.out" }, at + 0.08)
          .fromTo(id, { opacity: 1, scale: 0.5 }, { opacity: 0, scale: 1.5, duration: 0.5, ease: "power2.out", immediateRender: false }, at);
        if (show) tl.to(show, { opacity: 1, duration: 0.16, ease: "power1.inOut" }, at + 0.1);
        if (hide) tl.to(hide, { opacity: 0, duration: 0.16, ease: "power1.inOut" }, at + 0.1);
      }

      tl.fromTo("#cap", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.72, ease: "expo.out" }, 0.3);
      click("#click-forest", 1004, 640, 1.2, 0.7, "#st-forest");
      tl.to("#zoom", { scale: 1.015, duration: 5.0, ease: "sine.inOut" }, 0.4);
      click("#click-sakura", 1268, 640, 3.1, 0.6, "#st-sakura");
      click("#click-cancel", 686, 846, 5.25, 0.85, null, ["#st-forest", "#st-sakura"]);
      tl.to("#cursor", { x: REST.x, y: REST.y, duration: 0.8, ease: "power3.inOut" }, 5.6)
        .to("#zoom", { scale: 1, duration: 1.0, ease: "power2.inOut" }, 5.6)
        .to("#cap", { y: -12, opacity: 0, duration: 0.32, ease: "power2.in" }, 6.45);

      window.__timelines["card"] = tl;
    </script>
  </body>
</html>
